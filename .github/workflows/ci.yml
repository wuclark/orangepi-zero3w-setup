# Purpose: Run the repository's host-side verification suites on push and pull requests.
# Scope: Static checks and archive tests only; no board, root, or hardware required.
# Verification: Both jobs must pass; board validation stays explicit on real hardware.
name: ci

on:
  push:
  pull_request:

jobs:
  host-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static checks
        run: ./tests/static-checks.sh
      - name: Archive tests
        run: ./tests/test-archives.sh
